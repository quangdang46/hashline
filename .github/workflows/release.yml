name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: hashline

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            deps: musl-tools
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz
            deps: musl-tools
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            deps: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            deps: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            deps: ""

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Tag pushes use the tag name; workflow_dispatch runs on a branch, so
      # resolve the nearest reachable tag to keep asset names
      # (hashline-<tag>-<platform>.<ext>) identical to what install.sh and
      # `hashline update` expect.
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            git fetch --tags --force --quiet
            v="$(git describe --tags --abbrev=0)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install system dependencies
        if: matrix.deps != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.deps }}

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          retries=1
          if [ "${{ runner.os }}" = "Windows" ]; then retries=2; fi
          attempt=1
          while [ "$attempt" -le "$retries" ]; do
            echo "=== Build attempt $attempt/$retries ==="
            if cargo build --release --locked --target "${{ matrix.target }}" -p "$BINARY_NAME"; then
              exit 0
            fi
            if [ "$attempt" -eq "$retries" ]; then
              echo "::: Build failed after $retries attempts"
              exit 1
            fi
            echo "::: Build failed, retrying..."
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          STAGE_DIR="${BINARY_NAME}-${VERSION}-${{ matrix.name }}"
          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "$STAGE_DIR/"
          cp README.md LICENSE* "$STAGE_DIR/" 2>/dev/null || true
          tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
          shasum -a 256 "${STAGE_DIR}.tar.gz" | awk '{print $1}' > "${STAGE_DIR}.tar.gz.sha256"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          $stageDir = "$env:BINARY_NAME-$version-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BINARY_NAME.exe" "$stageDir/$env:BINARY_NAME.exe"
          if (Test-Path README.md) { Copy-Item README.md $stageDir }
          Get-ChildItem LICENSE* -ErrorAction SilentlyContinue | Copy-Item -Destination $stageDir -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stageDir/*" -DestinationPath "${stageDir}.zip" -Force
          $hash = (Get-FileHash "${stageDir}.zip" -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -FilePath "${stageDir}.zip.sha256" -Encoding ascii -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ env.BINARY_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.name }}.${{ matrix.archive_ext }}*

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Same resolution as the build job: tag name on tag pushes, nearest
      # reachable tag on workflow_dispatch.
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            git fetch --tags --force --quiet
            v="$(git describe --tags --abbrev=0)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: dist/*
          # generate_release_notes hits the "generate release notes" API,
          # which intermittently 500s (killed v0.9.17 publish 3x). Keep
          # notes static instead; body below is always available.
          generate_release_notes: false
          body: |
            ## hashline ${{ steps.version.outputs.version }}

            Hash-anchored line editing for AI coding agents.

            ### Install

            ```bash
            # Linux / macOS
            curl -fsSL "https://raw.githubusercontent.com/quangdang46/hashline/main/install.sh" | bash
            # Windows
            irm "https://raw.githubusercontent.com/quangdang46/hashline/main/install.ps1" | iex
            ```

            Verify checksums with the accompanying `.sha256` files.
