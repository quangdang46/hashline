[package]
name = "hashline"
version = "0.8.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hash-anchored line editing for AI coding agents. Library + CLI providing O(1) line addressing via 2-char xxh32 hashes, surgical edits with drift detection, and patch-safe text mutations."
repository = "https://github.com/quangdang46/hashline"
homepage = "https://github.com/quangdang46/hashline"
documentation = "https://docs.rs/hashline"
readme = "../../README.md"
keywords = ["editing", "patch", "anchor", "hash", "agent"]
categories = ["command-line-utilities", "text-editors", "development-tools"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "MIT",
    "../../README.md",
]
autobenches = false

[features]
default = []
# Enable SHA-256 window-hash anchor support — used by external tools
# (notably jcode pre-0.2.x) that need to call into hashline as a
# library while keeping their existing anchor schema. Pulls in the
# `sha2` crate. Disabled by default to keep the lean library footprint.
sha256-anchors = ["dep:sha2"]

[lib]
name = "hashline"
path = "src/lib.rs"

[[bin]]
name = "hashline"
path = "src/main.rs"

[dependencies]
xxhash-rust = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
regex = { workspace = true }
memchr = { workspace = true }
memmap2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Cached initialization
once_cell = "1.19"

# Daemon (serve mode): fork, PID file, socket locking
libc = "0.2"

# Optional SHA-256 backward-compat anchors (gated by `sha256-anchors` feature)
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "redactions"] }
criterion = "0.5"
tempfile = { workspace = true }

[[bench]]
name = "hash_bench"
harness = false

[[bench]]
name = "stats_bench"
harness = false

[[bench]]
name = "verify_bench"
harness = false

[[bench]]
name = "edit_bench"
harness = false
