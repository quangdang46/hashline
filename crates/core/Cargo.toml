[package]
name = "linehash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobenches = false

[[bin]]
name = "linehash"
path = "main.rs"

[dependencies]
xxhash-rust = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
regex-syntax = { workspace = true }
notify = { workspace = true }
walkdir = { workspace = true }
memchr = { workspace = true }
memmap2 = { workspace = true }
itoa = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = "0.8"

# Tree-sitter
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# Parallel processing
rayon = "1.10"
crossbeam = "0.8"
parking_lot = "0.12"

# Aho-Corasick for multi-pattern search
aho-corasick = "1.1"

# Bitset for line index
fixedbitset = "0.4"

# Bloom filter
bloomfilter = "1.0"

# LRU cache
lru = "0.17"

# Cached initialization
once_cell = "1.19"

# File walking
ignore = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "redactions"] }
criterion = "0.5"
tempfile = { workspace = true }

[[bench]]
name = "hash_bench"
harness = false

[[bench]]
name = "stats_bench"
harness = false

[[bench]]
name = "verify_bench"
harness = false

[[bench]]
name = "watch_bench"
harness = false

[[bench]]
name = "edit_bench"
harness = false

[[bench]]
name = "outline_bench"
harness = false

[[bench]]
name = "adaptive_bench"
harness = false
