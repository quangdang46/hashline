[package]
name = "hashline"
version = "0.1.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobenches = false

[[bin]]
name = "hashline"
path = "main.rs"

[dependencies]
xxhash-rust = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
notify = { workspace = true }
walkdir = { workspace = true }
memchr = { workspace = true }
memmap2 = { workspace = true }
itoa = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = "0.8"

# Parallel processing for hashing large files
rayon = "1.10"
crossbeam = "0.8"
parking_lot = "0.12"

# LRU cache
lru = "0.17"

# Cached initialization
once_cell = "1.19"

# File walking (used by hash sidecar discovery)
ignore = "0.4"
rustc-hash = "2.1.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json", "redactions"] }
criterion = "0.5"
tempfile = { workspace = true }

[[bench]]
name = "hash_bench"
harness = false

[[bench]]
name = "stats_bench"
harness = false

[[bench]]
name = "verify_bench"
harness = false

[[bench]]
name = "edit_bench"
harness = false
